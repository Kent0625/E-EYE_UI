{% extends "base.html" %}

{% block body_class %}flow-screen{% endblock %}

{% block content %}
<div class="new-screening-container">
  <div class="card">
    <div class="card-header">
      <h2 class="card-title">
        <svg class="icon icon-teal"><use href="#icon-scan"></use></svg>
        <span data-i18n="flow.new.title">New Screening</span>
      </h2>
    </div>

    <form id="form-new-screening">
      <!-- Participant Code -->
      <div class="form-group">
        <label for="input-code" class="form-label" data-i18n="flow.participantCode">
          Participant code
        </label>
        <input type="text" id="input-code" name="participant_code" required
               class="numeric form-input form-input-bg"
               value="{{ suggested_code or '' }}">
        <p class="form-hint" data-i18n="flow.code.note">
          Do not enter names.
        </p>
      </div>

      <!-- Site / Location (Optional) -->
      <div class="form-group-lg">
        <label for="input-site" class="form-label" data-i18n="flow.site">
          Screening site / location (optional)
        </label>
        <input type="text" id="input-site" name="site" placeholder="e.g. RHU Sumilao"
               value="{{ default_site or '' }}"
               class="form-input">
      </div>

      <!-- Consent Verification (Mandatory) -->
      <div class="consent-box">
        <h3 class="consent-title" data-i18n="flow.consent.title">Participant consent</h3>
        
        <label class="consent-label">
          <input type="checkbox" id="chk-age" required class="consent-checkbox">
          <span class="consent-text" data-i18n="flow.consent.age">Participant is 18 or older.</span>
        </label>

        <label class="consent-label">
          <input type="checkbox" id="chk-consent" required class="consent-checkbox">
          <span class="consent-text" data-i18n="flow.consent.signed">Written consent is signed and on file.</span>
        </label>
      </div>

      <div class="sticky-action-bar">
        <button type="submit" id="btn-continue" class="btn btn-primary btn-block" disabled data-i18n="flow.continue">
          Continue
        </button>
        <p id="continue-disabled-reason" class="action-disabled-reason">
          Check both consent boxes to continue.
        </p>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script type="module">
  import { postJson } from "{{ url_for('static', filename='js/api.js') }}";

  const form = document.getElementById("form-new-screening");
  const chkAge = document.getElementById("chk-age");
  const chkConsent = document.getElementById("chk-consent");
  const btnContinue = document.getElementById("btn-continue");
  const reason = document.getElementById("continue-disabled-reason");

  function validate() {
    const valid = chkAge.checked && chkConsent.checked;
    btnContinue.disabled = !valid;
    if (reason) reason.classList.toggle("hidden", valid);
  }

  chkAge.addEventListener("change", validate);
  chkConsent.addEventListener("change", validate);

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!chkAge.checked || !chkConsent.checked) return;

    const payload = {
      participant_code: document.getElementById("input-code").value.trim(),
      site: document.getElementById("input-site").value.trim(),
      consent_age: true,
      consent_signed: true,
      client_time: new Date().toISOString()
    };

    try {
      const res = await postJson("/api/sessions", payload);
      window.location.href = `/screen/${res.id}/OD`;
    } catch (err) {
      alert("Failed to initialize session: " + err.message);
    }
  });
</script>
{% endblock %}
