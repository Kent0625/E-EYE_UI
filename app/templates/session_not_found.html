{% extends "base.html" %}

{% block content %}
<div class="session-not-found-container">
  <div class="card session-not-found-card">
    <div class="not-found-icon-wrapper">
      <div class="not-found-icon-circle">
        <svg class="icon icon-xl"><use href="#icon-alert-circle"></use></svg>
      </div>
    </div>

    <h2 class="not-found-title">
      Screening session not found
    </h2>

    <p class="not-found-desc">
      The requested screening session (<span class="numeric not-found-code">{{ session_id }}</span>) does not exist or has been removed from this device.
    </p>

    <div class="not-found-actions">
      <a href="/screen/new" class="btn btn-primary btn-block">
        <svg class="icon"><use href="#icon-scan"></use></svg>
        <span>Start new screening</span>
      </a>
      <a href="/" class="btn btn-secondary btn-block">
        <svg class="icon"><use href="#icon-home"></use></svg>
        <span>Return to Home</span>
      </a>
    </div>
  </div>
</div>
{% endblock %}
