[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eeye-storage"
version = "1.0.0"
description = "Manifest-first E-Eye archives and verified connected-device receiving"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
eeye-storage = "eeye_storage.__main__:main"

[tool.setuptools.packages.find]
include = ["eeye_storage*"]
